[platformio]
default_envs = ESP32

[env:D1]
platform = espressif8266
board = d1
framework = arduino
monitor_speed = 9600
lib_deps = PubSubClient, https://github.com/dumpfheimer/esp_wifi_portal.git

[env:ESP8266]
platform = espressif8266
board = d1_mini_lite
framework = arduino
monitor_speed = 500000
lib_deps = PubSubClient, https://github.com/dumpfheimer/esp_wifi_portal.git

[env:ESP32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 500000
lib_deps = PubSubClient, https://github.com/dumpfheimer/esp_wifi_portal.git
; temporary while debugging the wifi connect regression:
; WIFI_MGR_DEBUG logs the lib's connect state machine, CORE_DEBUG_LEVEL=2 (warn)
; makes the ESP32 core print the reason code of every STA_DISCONNECTED event
; build_flags = -DWIFI_MGR_DEBUG -DCORE_DEBUG_LEVEL=2

